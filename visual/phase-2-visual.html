<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Evidence Dashboard — Phase 2 Visual</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"><\/script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --navy:#3E2F0B;--navy-mid:#6B5210;--navy-light:#8C6A15;
      --teal:#C9A94E;--teal-light:#E2CF96;--gold:#F4A261;
      --slate:#4A4F57;--bg:#FBFAF7;--card:#FFFFFF;--border:#E4E1D8;
      --text:#1A1C20;--muted:#767B84;
      --bp-pf:#2B5499;--bp-ti:#00A896;--bp-mm:#F4A261;--bp-sd:#E53E3E;--bp-if:#805AD5;
      --font:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
      --r:12px;--sh:0 2px 12px rgba(0,0,0,.08);--sh2:0 6px 24px rgba(0,0,0,.14)
    }
    html{font-size:16px}
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
    /* Header */
    header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-mid) 60%,var(--navy-light) 100%);color:#fff;padding:2.5rem 2rem 2rem;position:relative;overflow:hidden}
    header::after{content:'';position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.04)}
    header::before{content:'';position:absolute;right:60px;bottom:-120px;width:200px;height:200px;border-radius:50%;background:rgba(201,169,78,.12)}
    .hi{max-width:1280px;margin:0 auto;position:relative;z-index:1}
    .badge{background:rgba(201,169,78,.2);border:1px solid rgba(201,169,78,.4);color:var(--teal-light);font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.25rem .75rem;border-radius:999px;display:inline-block;margin-bottom:.75rem}
    header h1{font-size:2rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}
    header p{margin-top:.5rem;color:rgba(255,255,255,.7);font-size:.95rem}
    .stats{display:flex;gap:1.5rem;flex-wrap:wrap;margin-top:1.75rem}
    .spl{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:.6rem 1.2rem;text-align:center;min-width:110px}
    .spl .v{font-size:1.6rem;font-weight:700;color:#FBFAF7;line-height:1}
    .spl .l{font-size:.7rem;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.07em;margin-top:.2rem}
    /* Layout */
    .page{max-width:1280px;margin:0 auto;padding:2rem}
    /* Filter bar */
    .fb{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.5rem;margin-bottom:2rem;box-shadow:var(--sh);display:flex;flex-wrap:wrap;align-items:center;gap:1rem}
    .fb label{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-right:.25rem}
    .fg{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
    .fb select,.fb input[type=date]{font-family:var(--font);font-size:.85rem;border:1px solid var(--border);border-radius:8px;padding:.4rem .75rem;background:var(--bg);color:var(--text);cursor:pointer;transition:border-color .15s}
    .fb select:focus,.fb input:focus{outline:none;border-color:var(--navy-light)}
    .btn-r{margin-left:auto;font-family:var(--font);font-size:.8rem;font-weight:600;padding:.4rem 1rem;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--slate);cursor:pointer;transition:all .15s}
    .btn-r:hover{background:var(--bg);border-color:var(--navy-light);color:var(--navy)}
    /* Cards */
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem}
    .gf{margin-bottom:1.5rem}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:1.5rem;transition:box-shadow .2s}
    .card:hover{box-shadow:var(--sh2)}
    .ch{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.25rem;flex-wrap:wrap;gap:.5rem}
    .ct{font-size:1rem;font-weight:700;color:var(--navy);letter-spacing:-.01em}
    .cs{font-size:.78rem;color:var(--muted);margin-top:.15rem}
    .ctag{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.2rem .65rem;border-radius:999px;background:var(--bg);border:1px solid var(--border);color:var(--slate)}
    .cw{position:relative;width:100%}
    .cw canvas{max-width:100%}
    /* Heatmap */
    .hmc{overflow-x:auto}
    .hmt{width:100%;border-collapse:collapse;font-size:.82rem;min-width:560px}
    .hmt th{padding:.6rem .9rem;text-align:left;font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:2px solid var(--border);white-space:nowrap}
    .hmt th:first-child{width:170px}
    .hmt td{padding:.55rem .9rem;border-bottom:1px solid var(--border);vertical-align:middle}
    .hmt tr:last-child td{border-bottom:none}
    .hm-bar{height:22px;border-radius:4px;min-width:6px;display:inline-flex;align-items:center;padding:0 6px;font-size:.7rem;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap;transition:width .4s ease}
    .cat-lbl{font-weight:700;color:var(--navy);font-size:.82rem}
    .conf-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
    .ch-dot{background:var(--teal)}
    .cm-dot{background:var(--gold)}
    /* Legend */
    .leg{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1rem}
    .li{display:flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--slate)}
    .ls{width:12px;height:12px;border-radius:3px;flex-shrink:0}
    /* no-data */
    .nd{text-align:center;padding:2rem;color:var(--muted);font-size:.9rem}
    /* footer */
    footer{text-align:center;padding:2rem;color:var(--muted);font-size:.75rem;border-top:1px solid var(--border);margin-top:2rem}
    /* responsive */
    @media(max-width:768px){
      header{padding:1.5rem 1rem 1.25rem}header h1{font-size:1.4rem}
      .page{padding:1rem}.g2{grid-template-columns:1fr}
      .fb{flex-direction:column;align-items:stretch}.btn-r{margin-left:0}
      .spl .v{font-size:1.3rem}
    }
  </style>

</header>

<main class="page">

  <!-- Filter Bar -->

        <option value="Deloitte">Deloitte</option>

        <option value="KPMG">KPMG</option>
        <option value="Forrester">Forrester</option>

        <option value="Bain">Bain</option>
        <option value="BCG">BCG</option>
        <option value="Gallup">Gallup</option>
        <option value="Research">Research/Other</option>
        <option value="Charter Works">Charter Works</option>
        <option value="Grant Thornton">Grant Thornton</option>
      </select>
    </div>
    <div class="fg"><label>From</label><input type="date" id="f-from" value="2026-04-01"></div>
    <div class="fg"><label>To</label><input type="date" id="f-to" value="2026-07-31"></div>
    <button class="btn-r" id="btn-r">↺ Reset</button>
  </div>

  <!-- Row 1 -->
  <div class="g2">
    <div class="card">
      <div class="ch">
        <div><div class="ct">Breakpoint Distribution</div><div class="cs">Evidence entries per organizational breakpoint</div></div>
        <span class="ctag">Chart 1</span>
      </div>
      <div class="cw" style="height:300px"><canvas id="c-dist"></canvas></div>
      <div class="leg" id="leg-dist"></div>
    </div>
    <div class="card">
      <div class="ch">
        <div><div class="ct">Credibility Profile</div><div class="cs">Source quality split across filtered evidence</div></div>
        <span class="ctag">Chart 2</span>
      </div>
      <div class="cw" style="height:260px"><canvas id="c-cred"></canvas></div>
      <div id="cred-sum" style="text-align:center;margin-top:.75rem;font-size:.82rem;color:var(--muted)"></div>
    </div>
  </div>

  <!-- Row 2 -->
  <div class="gf">
    <div class="card">
      <div class="ch">
        <div><div class="ct">Field Momentum — Publication Timeline</div><div class="cs">Research velocity: entries logged per date, reveals when evidence clusters emerged</div></div>
        <span class="ctag">Chart 3</span>
      </div>
      <div class="cw" style="height:260px"><canvas id="c-time"></canvas></div>
    </div>
  </div>

  <!-- Row 3 -->
  <div class="gf">
    <div class="card">
      <div class="ch">
        <div><div class="ct">Source × Breakpoint Credibility Heatmap</div><div class="cs">Evidence strength by publisher category — bar width = citation count, color = confidence tier</div></div>
        <span class="ctag">Chart 4 · Heatmap</span>
      </div>
      <div class="hmc">
        <table class="hmt">
          <thead>
            <tr>
              <th>Source Category</th>
              <th>Process Friction</th>
              <th>Technology Illusion</th>
              <th>Momentum Mirage</th>
              <th>Strategic Disconnection</th>
              <th>Incentive Fragmentation</th>
            </tr>
          </thead>
          <tbody id="hm-body"></tbody>
        </table>
      </div>
      <div class="leg" style="margin-top:1rem">
        <div class="li"><span class="conf-dot ch-dot"></span><span>High Credibility (peer-reviewed / primary data)</span></div>
        <div class="li"><span class="conf-dot cm-dot"></span><span>Moderate Credibility (industry reports / practitioner research)</span></div>
        <div class="li" style="margin-left:auto;font-size:.72rem;color:var(--muted)">Bar width ∝ evidence count within category</div>
      </div>
    </div>
  </div>

</main>

<script>
const DATASET = JSON.parse(document.getElementById('ds').textContent);

const BPM = {
  process_friction:        {label:'Process Friction',        color:'#2B5499'},
  technology_illusion:     {label:'Technology Illusion',     color:'#00A896'},
  momentum_mirage:         {label:'Momentum Mirage',         color:'#F4A261'},
  strategic_disconnection: {label:'Strategic Disconnection', color:'#E53E3E'},
  incentive_fragmentation: {label:'Incentive Fragmentation', color:'#805AD5'},
};
const BPK = Object.keys(BPM);
const CATS = ['Consulting','Academic / Research','Business Media','Other'];

function getF(){
  return {
    bp:   document.getElementById('f-bp').value,
    cred: document.getElementById('f-cred').value,
    pub:  document.getElementById('f-pub').value,
    from: document.getElementById('f-from').value,
    to:   document.getElementById('f-to').value,
  };
}

function filter(f){
  return DATASET.filter(e=>{
    if(f.cred!=='all' && e.credibility!==f.cred) return false;
    if(f.pub!=='all'  && e.publisher!==f.pub)    return false;
    if(e.date){
      if(f.from && e.date < f.from) return false;
      if(f.to   && e.date > f.to)   return false;
    }
    if(f.bp!=='all'){
      if(!e.breakpoints.some(b=>b.name===f.bp)) return false;
    }
    return true;
  });
}

let cDist, cCred, cTime;

function buildAll(){
  const f = getF();
  const entries = filter(f);
  document.getElementById('s-total').textContent = entries.length;
  document.getElementById('s-high').textContent  = entries.filter(e=>e.credibility==='high').length;
  buildDist(entries, f);
  buildCred(entries);
  buildTimeline(entries);
  buildHeatmap(entries, f);
}

// ── Chart 1: Breakpoint Distribution ──────────────────────────────────
function buildDist(entries, f){
  const counts = {};
  BPK.forEach(k=>counts[k]=0);
  entries.forEach(e=>e.breakpoints.forEach(b=>{
    if((f.bp==='all'||b.name===f.bp) && counts[b.name]!==undefined) counts[b.name]++;
  }));
  const labels = BPK.map(k=>BPM[k].label);
  const data   = BPK.map(k=>counts[k]);
  const colors = BPK.map(k=>BPM[k].color);
  if(cDist) cDist.destroy();
  cDist = new Chart(document.getElementById('c-dist'),{
    type:'bar',
    data:{labels,datasets:[{
      label:'Evidence Entries',data,
      backgroundColor:colors.map(c=>c+'CC'),borderColor:colors,
      borderWidth:2,borderRadius:6,borderSkipped:false
    }]},
    options:{
      indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:ctx=>` ${ctx.raw} entries`}}
      },
      scales:{
        x:{beginAtZero:true,grid:{color:'#E2E8F033'},ticks:{font:{size:11}},
           title:{display:true,text:'Evidence Count',font:{size:11},color:'#718096'}},
        y:{grid:{display:false},ticks:{font:{size:12,weight:'600'}}}
      }
    }
  });
  const lg = document.getElementById('leg-dist');
  lg.innerHTML = BPK.map((k,i)=>
    `<div class="li"><span class="ls" style="background:${colors[i]}"></span>${labels[i]}: <strong>${data[i]}</strong></div>`
  ).join('');
}

// ── Chart 2: Credibility Donut ─────────────────────────────────────────
function buildCred(entries){
  const h = entries.filter(e=>e.credibility==='high').length;
  const m = entries.filter(e=>e.credibility==='moderate').length;
  const t = entries.length || 1;
  if(cCred) cCred.destroy();
  cCred = new Chart(document.getElementById('c-cred'),{
    type:'doughnut',
    data:{
      labels:['High Credibility','Moderate Credibility'],
      datasets:[{data:[h,m],
        backgroundColor:['#00A896CC','#F4A261CC'],
        borderColor:['#00A896','#F4A261'],
        borderWidth:2,hoverOffset:8
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,cutout:'65%',
      plugins:{
        legend:{position:'bottom',labels:{font:{size:12},padding:16,usePointStyle:true,pointStyleWidth:10}},
        tooltip:{callbacks:{label:ctx=>` ${ctx.raw} entries (${Math.round(ctx.raw/t*100)}%)`}}
      }
    }
  });
  document.getElementById('cred-sum').innerHTML =
    `<strong>${Math.round(h/t*100)}%</strong> of filtered evidence rated <span style="color:#00A896;font-weight:700">High Credibility</span>`;
}

// ── Chart 3: Timeline ─────────────────────────────────────────────────
function buildTimeline(entries){
  const dc = {};
  entries.forEach(e=>{if(e.date) dc[e.date]=(dc[e.date]||0)+1});
  const dates = Object.keys(dc).sort();
  const data  = dates.map(d=>dc[d]);
  if(cTime) cTime.destroy();
  if(!dates.length){
    const cv = document.getElementById('c-time');
    cv.parentElement.innerHTML='<div class="nd">No dated entries match current filters.</div>';
    return;
  }
  cTime = new Chart(document.getElementById('c-time'),{
    type:'bar',
    data:{labels:dates,datasets:[{
      label:'Entries',data,
      backgroundColor:'#2B549999',borderColor:'#2B5499',
      borderWidth:1.5,borderRadius:4,borderSkipped:false
    }]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{
          title:ctx=>`Date: ${ctx[0].label}`,
          label:ctx=>` ${ctx.raw} entries`
        }}
      },
      scales:{
        x:{grid:{display:false},ticks:{font:{size:10},maxRotation:45,maxTicksLimit:14}},
        y:{beginAtZero:true,grid:{color:'#E2E8F033'},ticks:{font:{size:11},stepSize:1},
           title:{display:true,text:'Entries',font:{size:11},color:'#718096'}}
      }
    }
  });
}

// ── Chart 4: Heatmap ─────────────────────────────────────────────────
function buildHeatmap(entries, f){
  // Aggregate per category+bp+credibility
  const hm = {};
  CATS.forEach(cat=>{hm[cat]={};BPK.forEach(k=>{hm[cat][k]={high:0,moderate:0}})});
  entries.forEach(e=>{
    const cat = e.category in hm ? e.category : 'Other';
    e.breakpoints.forEach(b=>{
      if(BPK.includes(b.name)){
        hm[cat][b.name][e.credibility]==(undefined)?0:0; // init
        hm[cat][b.name][e.credibility]=(hm[cat][b.name][e.credibility]||0)+1;
      }
    });
  });
  // Find max total for scaling
  let maxVal = 1;
  CATS.forEach(cat=>BPK.forEach(k=>{
    const t=(hm[cat][k].high||0)+(hm[cat][k].moderate||0);
    if(t>maxVal) maxVal=t;
  }));
  // Build rows — skip "Other" if empty
  const body = document.getElementById('hm-body');
  body.innerHTML='';
  CATS.filter(cat=>cat!=='Other').forEach(cat=>{
    const tr = document.createElement('tr');
    // Category label cell
    const td0 = document.createElement('td');
    td0.innerHTML=`<span class="cat-lbl">${cat}</span>`;
    tr.appendChild(td0);
    BPK.forEach(k=>{
      const h=(hm[cat][k].high||0);
      const m=(hm[cat][k].moderate||0);
      const tot=h+m;
      const pctH = Math.round((h/maxVal)*200); // max 200px
      const pctM = Math.round((m/maxVal)*200);
      const td = document.createElement('td');
      td.innerHTML=`
        <div style="display:flex;flex-direction:column;gap:3px">
          ${h>0?`<div class="hm-bar" style="width:${pctH}px;background:#00A896">${h>0?h:''}</div>`:''}
          ${m>0?`<div class="hm-bar" style="width:${pctM}px;background:#F4A261">${m>0?m:''}</div>`:''}
          ${tot===0?'<span style="color:#CBD5E0;font-size:.7rem">—</span>':''}
        </div>`;
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}

// ── Event listeners ───────────────────────────────────────────────────
['f-bp','f-cred','f-pub','f-from','f-to'].forEach(id=>{
  document.getElementById(id).addEventListener('change', buildAll);
});

  document.getElementById('f-cred').value = 'all';
  document.getElementById('f-pub').value  = 'all';
  document.getElementById('f-from').value = '2026-04-01';
  document.getElementById('f-to').value   = '2026-07-31';
  buildAll();
});

buildAll();
