nce Needed for AI Era Productivity Gains\"","publisher":"World Economic Forum (weforum.org)","category":"Academic / Research","credibility":"high","date":"2026-07-23","breakpoints":[{"name":"strategic_disconnection","strength":"high"},{"name":"incentive_fragmentation","strength":"high"},{"name":"momentum_mirage","strength":"high"}],"pub_date":"2026-07-23"},{"id":"2026-07-23-writer-com-blog-writer-cmo-the-ai-leadership-gap-ev","title":"Writer/CMO: \"The AI Leadership Gap \u2014 Even Marketers Who Use AI Fear They'll Be Replaced\"","publisher":"Writer.com blog (Diego Lomanto","category":"Academic / Research","credibility":"moderate","date":"2026-07-23","breakpoints":[{"name":"strategic_disconnection","strength":"moderate"},{"name":"incentive_fragmentation","strength":"moderate"},{"name":"momentum_mirage","strength":"moderate"}],"pub_date":"2026-07-23"},{"id":"2026-07-23-diego-lomanto-c-writer-cmo-ai-leadership-gap-in-mar","title":"Writer CMO / AI Leadership Gap in Marketing \u2014 June 24, 2026","publisher":"Diego Lomanto (CMO","category":"Academic / Research","credibility":"moderate","date":"2026-07-23","breakpoints":[{"name":"strategic_disconnection","strength":"moderate"},{"name":"incentive_fragmentation","strength":"moderate"},{"name":"momentum_mirage","strength":"moderate"}],"pub_date":"2026-06-24"},{"id":"2026-07-23-variety-july-10-xbox-3-200-job-cuts-ceo-fed-appoint","title":"Xbox 3,200 Job Cuts + CEO Fed Appointment \u2014 The Accountability Laundering Refinement Case","publisher":"Variety (July 10)","category":"Academic / Research","credibility":"moderate","date":"2026-07-23","breakpoints":[{"name":"momentum_mirage","strength":"moderate"},{"name":"technology_illusion","strength":"moderate"},{"name":"strategic_disconnection","strength":"moderate"}],"pub_date":"2026-07-23"},{"id":"2026-07-23-hbr-april-30-20-jamil-zaki-empathetic-leadership-ca","title":"Jamil Zaki \u2014 \"Empathetic Leadership Can Make or Break AI Adoption\"","publisher":"HBR","category":"Business Media","credibility":"high","date":"2026-07-23","breakpoints":[{"name":"strategic_disconnection","strength":"high"},{"name":"momentum_mirage","strength":"high"}],"pub_date":"2026-07-23"},{"id":"2026-07-23-zen-ex-machina-zen-ex-machina-the-accountability-a","title":"Zen Ex Machina: \"The Accountability Architecture You Have Was Designed for Human Decisions\"","publisher":"Zen Ex Machina (zenexmachina.com)","category":"Academic / Research","credibility":"moderate","date":"2026-07-23","breakpoints":[{"name":"process_friction","strength":"moderate"},{"name":"momentum_mirage","strength":"moderate"}],"pub_date":"2026-07-23"},{"id":"2026-07-23-entrepreneur-ai-zuckerberg-meta-made-mistakes-in-ai","title":"Zuckerberg: Meta \"Made Mistakes\" in AI Workforce Restructuring (June 2026)","publisher":"Entrepreneur","category":"Academic / Research","credibility":"moderate","date":"2026-07-23","breakpoints":[{"name":"strategic_disconnection","strength":"moderate"},{"name":"incentive_fragmentation","strength":"moderate"},{"name":"momentum_mirage","strength":"moderate"}],"pub_date":"2026-07-23"},{"id":"2026-07-23-scotchtown-tech-ai-fatigue-and-the-ai-first-recalib","title":"AI Fatigue and the AI-First Recalibration","publisher":"Scotchtown Technology","category":"Academic / Research","credibility":"moderate","date":"2026-07-23","breakpoints":[{"name":"momentum_mirage","strength":"moderate"},{"name":"technology_illusion","strength":"moderate"}],"pub_date":"2026-06-16"},{"id":"2026-07-23-hr-executive-ai-layoff-regret-and-the-boomerang","title":"AI Layoff Regret and The Boomerang Employee Wave","publisher":"HR Executive","category":"Academic / Research","credibility":"moderate","date":"2026-07-23","breakpoints":[{"name":"incentive_fragmentation","strength":"moderate"},{"name":"momentum_mirage","strength":"moderate"}],"pub_date":"2026-04-30"},{"id":"2026-07-23-satya-nadella-m-nadella-frontier-ecosystem-and-the","title":"Nadella: Frontier Ecosystem and the Learning Loop","publisher":"Microsoft","category":"Academic / Research","credibility":"high","date":"2026-07-23","breakpoints":[{"name":"process_friction","strength":"high"},{"name":"technology_illusion","strength":"high"},{"name":"strategic_disconnection","strength":"high"}],"pub_date":"2026-06-15"},{"id":"2026-07-23-nber-nber-working-paper-34836-no-measura","title":"NBER Working Paper 34836: No Measurable AI Impact in Four Economies","publisher":"NBER","category":"Academic / Research","credibility":"high","date":"2026-07-23","breakpoints":[{"name":"technology_illusion","strength":"high"},{"name":"momentum_mirage","strength":"high"},{"name":"process_friction","strength":"high"}],"pub_date":"2026-05-01"}]</script>

<script>
(function() {
  // ── Constants ──────────────────────────────────────────────────────────
  const BP_COLORS = {
    strategic_disconnection: '#E53E3E',
    incentive_fragmentation: '#805AD5',
    process_friction:        '#2B5499',
    technology_illusion:     '#00A896',
    momentum_mirage:         '#F4A261'
  };
  const BP_LABELS = {
    strategic_disconnection: ['Strategic', 'Disconnection'],
    incentive_fragmentation: ['Incentive', 'Fragmentation'],
    process_friction:        ['Process', 'Friction'],
    technology_illusion:     ['Technology', 'Illusion'],
    momentum_mirage:         ['Momentum', 'Mirage']
  };
  const CAT_COLORS = {
    'Consulting':          '#2B5499',
    'Academic / Research': '#00A896',
    'Business Media':      '#F4A261'
  };
  const BP_KEYS = Object.keys(BP_COLORS);
  const BP_RADIUS = 28;
  const SRC_RADIUS = 5;
  const PENTAGON_RADIUS = 220;

  // ── Load dataset ───────────────────────────────────────────────────────
  const dataset = JSON.parse(document.getElementById('ds').textContent);

  // ── SVG setup ──────────────────────────────────────────────────────────
  const svg = d3.select('#graph');
  let W, H;

  function getDims() {
    const el = document.getElementById('graph-container');
    W = el.clientWidth;
    H = el.clientHeight;
  }
  getDims();

  const g = svg.append('g').attr('class', 'root');

  // Zoom behavior
  const zoom = d3.zoom()
    .scaleExtent([0.2, 4])
    .on('zoom', (event) => {
      g.attr('transform', event.transform);
    });
  svg.call(zoom);

  // Click on SVG background to clear highlight
  svg.on('click', function(event) {
    if (event.target === this || event.target.tagName === 'svg') {
      clearHighlight();
    }
  });

  // ── Build nodes ────────────────────────────────────────────────────────
  function pentagonPos(i, cx, cy, r) {
    const angle = (i * 2 * Math.PI / 5) - Math.PI / 2;
    return { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
  }

  function buildGraph() {
    getDims();
    const cx = W / 2, cy = H / 2;

    // Breakpoint nodes (fixed)
    const bpNodes = BP_KEYS.map((key, i) => {
      const pos = pentagonPos(i, cx, cy, PENTAGON_RADIUS);
      return {
        id: key,
        type: 'breakpoint',
        label: BP_LABELS[key],
        color: BP_COLORS[key],
        fx: pos.x,
        fy: pos.y,
        x: pos.x,
        y: pos.y
      };
    });

    // Source nodes
    const srcNodes = dataset.map(d => ({
      id: d.id,
      type: 'source',
      title: d.title,
      publisher: d.publisher,
      category: d.category,
      date: d.date,
      breakpoints: d.breakpoints.map(b => b.name),
      color: CAT_COLORS[d.category] || '#6b91c1',
      // start near center
      x: cx + (Math.random() - 0.5) * 60,
      y: cy + (Math.random() - 0.5) * 60
    }));

    const nodeMap = {};
    [...bpNodes, ...srcNodes].forEach(n => { nodeMap[n.id] = n; });

    // Links
    const links = [];
    srcNodes.forEach(src => {
      src.breakpoints.forEach(bpKey => {
        links.push({
          source: src.id,
          target: bpKey,
          bpKey,
          color: BP_COLORS[bpKey]
        });
      });
    });

    return { nodes: [...bpNodes, ...srcNodes], links, bpNodes, srcNodes, nodeMap };
  }

  let { nodes, links, bpNodes, srcNodes, nodeMap } = buildGraph();

  // ── Draw links ─────────────────────────────────────────────────────────
  const linkGroup = g.append('g').attr('class', 'links');
  const nodeGroup = g.append('g').attr('class', 'nodes');

  let linkSel = linkGroup.selectAll('line')
    .data(links, d => d.source.id + '->' + d.target.id)
    .join('line')
    .attr('stroke', d => d.color)
    .attr('stroke-opacity', 0.3)
    .attr('stroke-width', 0.8);

  // ── Draw source nodes ──────────────────────────────────────────────────
  let srcSel = nodeGroup.selectAll('circle.src')
    .data(srcNodes, d => d.id)
    .join('circle')
    .attr('class', 'src')
    .attr('r', SRC_RADIUS)
    .attr('fill', d => d.color)
    .attr('fill-opacity', 0.75)
    .attr('stroke', 'none')
    .style('cursor', 'pointer')
    .on('mouseover', onSrcHover)
    .on('mousemove', onMouseMove)
    .on('mouseout', onMouseOut);

  // ── Draw breakpoint nodes ──────────────────────────────────────────────
  const bpGroup = nodeGroup.selectAll('g.bp')
    .data(bpNodes, d => d.id)
    .join('g')
    .attr('class', 'bp')
    .style('cursor', 'pointer')
    .on('mouseover', onBpHover)
    .on('mouseout', onMouseOut);

  bpGroup.append('circle')
    .attr('r', BP_RADIUS)
    .attr('fill', d => d.color)
    .attr('fill-opacity', 0.9)
    .attr('stroke', '#fff')
    .attr('stroke-width', 1.5);

  // Pulse ring
  bpGroup.append('circle')
    .attr('r', BP_RADIUS + 6)
    .attr('fill', 'none')
    .attr('stroke', d => d.color)
    .attr('stroke-opacity', 0.35)
    .attr('stroke-width', 2);

  bpGroup.each(function(d) {
    const el = d3.select(this);
    const lines = d.label;
    if (lines.length === 1) {
      el.append('text')
        .attr('text-anchor', 'middle')
        .attr('dy', '0.35em')
        .attr('fill', '#fff')
        .attr('font-size', '10px')
        .attr('font-weight', '700')
        .attr('pointer-events', 'none')
        .text(lines[0]);
    } else {
      const txt = el.append('text')
        .attr('text-anchor', 'middle')
        .attr('fill', '#fff')
        .attr('font-size', '9.5px')
        .attr('font-weight', '700')
        .attr('pointer-events', 'none');
      txt.append('tspan')
        .attr('x', 0)
        .attr('dy', '-0.6em')
        .text(lines[0]);
      txt.append('tspan')
        .attr('x', 0)
        .attr('dy', '1.25em')
        .text(lines[1]);
    }
  });

  // ── Force simulation ───────────────────────────────────────────────────
  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(80).strength(0.4))
    .force('charge', d3.forceManyBody().strength(-30))
    .force('collision', d3.forceCollide(7))
    .on('tick', ticked);

  function ticked() {
    linkSel
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);

    srcSel
      .attr('cx', d => d.x)
      .attr('cy', d => d.y);

    bpGroup
      .attr('transform', d => `translate(${d.fx},${d.fy})`);
  }

  // ── Tooltip ────────────────────────────────────────────────────────────
  const tooltip = document.getElementById('tooltip');
  const ttTitle = document.getElementById('tt-title');
  const ttPub   = document.getElementById('tt-pub');
  const ttCat   = document.getElementById('tt-cat');
  const ttBps   = document.getElementById('tt-bps');

  function showTooltip(d, evt) {
    ttTitle.textContent = d.title;
    ttPub.textContent   = d.publisher || '';
    ttCat.textContent   = d.category  || '';
    ttCat.style.color   = CAT_COLORS[d.category] || '#8ba6cc';
    ttBps.textContent   = d.breakpoints.map(b => BP_LABELS[b].join(' ')).join(' · ');
    positionTooltip(evt);
    tooltip.style.display = 'block';
  }
  function positionTooltip(evt) {
    const tw = 280, pad = 12;
    let lx = evt.clientX + 14;
    let ly = evt.clientY - 10;
    if (lx + tw > window.innerWidth) lx = evt.clientX - tw - 14;
    if (ly < 0) ly = 0;
    tooltip.style.left = lx + 'px';
    tooltip.style.top  = ly + 'px';
  }
  function hideTooltip() {
    tooltip.style.display = 'none';
  }

  function onMouseMove(evt) { positionTooltip(evt); }
  function onMouseOut()  { hideTooltip(); }

  // ── Highlight logic ────────────────────────────────────────────────────
  let highlighted = false;

  function highlightSource(d, evt) {
    highlighted = true;
    const connectedLinks  = new Set();
    const connectedBpKeys = new Set();
    links.forEach(lk => {
      const srcId = lk.source.id || lk.source;
      if (srcId === d.id) {
        connectedLinks.add(lk);
        connectedBpKeys.add(lk.bpKey);
      }
    });
    linkSel
      .attr('stroke-opacity', lk => connectedLinks.has(lk) ? 0.85 : 0.04)
      .attr('stroke-width',  lk => connectedLinks.has(lk) ? 1.5  : 0.8);
    srcSel
      .attr('fill-opacity', nd => nd.id === d.id ? 1.0 : 0.06)
      .attr('r',            nd => nd.id === d.id ? SRC_RADIUS + 2 : SRC_RADIUS);
    bpGroup.select('circle:first-child')
      .attr('fill-opacity', nd => connectedBpKeys.has(nd.id) ? 1.0 : 0.15);
    if (evt) showTooltip(d, evt);
  }

  function highlightBreakpoint(d) {
    highlighted = true;
    const connectedLinks   = new Set();
    const connectedSrcIds  = new Set();
    links.forEach(lk => {
      const tgtId = lk.target.id || lk.target;
      if (tgtId === d.id) {
        connectedLinks.add(lk);
        const srcId = lk.source.id || lk.source;
        connectedSrcIds.add(srcId);
      }
    });
    linkSel
      .attr('stroke-opacity', lk => connectedLinks.has(lk) ? 0.8 : 0.04)
      .attr('stroke-width',  lk => connectedLinks.has(lk) ? 1.2 : 0.8);
    srcSel
      .attr('fill-opacity', nd => connectedSrcIds.has(nd.id) ? 0.9 : 0.05)
      .attr('r',            nd => connectedSrcIds.has(nd.id) ? SRC_RADIUS + 1 : SRC_RADIUS);
    bpGroup.select('circle:first-child')
      .attr('fill-opacity', nd => nd.id === d.id ? 1.0 : 0.2);
  }

  function clearHighlight() {
    if (!highlighted) return;
    highlighted = false;
    applyFilters();
    hideTooltip();
  }

  function onSrcHover(evt, d) {
    // Only highlight if visible
    if (srcSel.filter(nd => nd.id === d.id).attr('display') === 'none') return;
    highlightSource(d, evt);
  }

  function onBpHover(evt, d) {
    highlightBreakpoint(d);
  }

  // ── Filters ────────────────────────────────────────────────────────────
  let activeBp  = '';
  let activeCat = '';

  function applyFilters() {
    srcSel.each(function(d) {
      const bpOk  = !activeBp  || d.breakpoints.includes(activeBp);
      const catOk = !activeCat || d.category === activeCat;
      const vis   = bpOk && catOk;
      d3.select(this)
        .attr('fill-opacity', vis ? 0.75 : 0)
        .attr('pointer-events', vis ? 'auto' : 'none')
        .attr('display', vis ? null : 'none');
    });

    const visIds = new Set();
    srcSel.each(function(d) {
      if (d3.select(this).attr('display') !== 'none') visIds.add(d.id);
    });

    linkSel
      .attr('stroke-opacity', lk => {
        const srcId = lk.source.id || lk.source;
        const bpMatch = !activeBp || lk.bpKey === activeBp;
        return visIds.has(srcId) && bpMatch ? 0.3 : 0;
      });

    bpGroup.select('circle:first-child').attr('fill-opacity', 0.9);
    srcSel.attr('r', SRC_RADIUS);

    // Count visible
    const cnt = visIds.size;
    document.getElementById('status-label').textContent =
      (activeBp || activeCat) ? `${cnt} sources visible` : '';
  }

  document.getElementById('bp-filter').addEventListener('change', function() {
    clearHighlight();
    activeBp = this.value;
    applyFilters();
  });
  document.getElementById('cat-filter').addEventListener('change', function() {
    clearHighlight();
    activeCat = this.value;
    applyFilters();
  });
  document.getElementById('reset-btn').addEventListener('click', function() {
    document.getElementById('bp-filter').value  = '';
    document.getElementById('cat-filter').value = '';
    activeBp  = '';
    activeCat = '';
    clearHighlight();
    applyFilters();
  });

  // ── Resize ─────────────────────────────────────────────────────────────
  function onResize() {
    getDims();
    const cx = W / 2, cy = H / 2;
    // Reposition breakpoint nodes
    bpNodes.forEach((n, i) => {
      const pos = pentagonPos(i, cx, cy, PENTAGON_RADIUS);
      n.fx = pos.x;
      n.fy = pos.y;
      n.x  = pos.x;
      n.y  = pos.y;
    });
    sim.alpha(0.1).restart();
  }

  const ro = new ResizeObserver(() => onResize());
  ro.observe(document.getElementById('graph-container'));

  // Initial filter pass
  applyFilters();

})();
</script>
